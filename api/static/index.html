<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BBB Penetration Predictor</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 600px;
            width: 100%;
            padding: 40px;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
        }

        .examples {
            margin-top: 10px;
            font-size: 12px;
            color: #666;
        }

        .example-btn {
            background: none;
            border: none;
            color: #667eea;
            cursor: pointer;
            text-decoration: underline;
            padding: 0;
            margin-right: 10px;
        }

        .example-btn:hover {
            color: #764ba2;
        }

        button[type="submit"] {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button[type="submit"]:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }

        button[type="submit"]:active {
            transform: translateY(0);
        }

        button[type="submit"]:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .result {
            margin-top: 30px;
            padding: 20px;
            border-radius: 8px;
            display: none;
        }

        .result.show {
            display: block;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .result.positive {
            background: #d4edda;
            border: 2px solid #28a745;
        }

        .result.negative {
            background: #f8d7da;
            border: 2px solid #dc3545;
        }

        .result h2 {
            margin-bottom: 15px;
            font-size: 20px;
        }

        .result.positive h2 {
            color: #155724;
        }

        .result.negative h2 {
            color: #721c24;
        }

        .result-item {
            margin: 10px 0;
            font-size: 14px;
        }

        .result-item strong {
            display: inline-block;
            width: 140px;
        }

        .progress-bar {
            width: 100%;
            height: 24px;
            background: #e0e0e0;
            border-radius: 12px;
            overflow: hidden;
            margin: 15px 0;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #28a745, #20c997);
            transition: width 0.6s ease-out;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 12px;
            font-weight: 600;
        }

        .error {
            background: #f8d7da;
            border: 2px solid #dc3545;
            color: #721c24;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            display: none;
        }

        .error.show {
            display: block;
        }

        .loading {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid #ffffff;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-left: 8px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧬 BBB Penetration Predictor</h1>
        <p class="subtitle">Predict if a molecule can cross the Blood-Brain Barrier using AI</p>

        <form id="predictionForm">
            <div class="input-group">
                <label for="smiles">Enter SMILES String:</label>
                <input 
                    type="text" 
                    id="smiles" 
                    name="smiles" 
                    placeholder="e.g., CN1C=NC2=C1C(=O)N(C(=O)N2C)C"
                    required
                />
                <div class="examples">
                    Try: 
                    <button type="button" class="example-btn" onclick="fillExample('CN1C=NC2=C1C(=O)N(C(=O)N2C)C')">Caffeine</button>
                    <button type="button" class="example-btn" onclick="fillExample('CCO')">Ethanol</button>
                    <button type="button" class="example-btn" onclick="fillExample('CC(C)Cc1ccc(cc1)C(C)C(O)=O')">Ibuprofen</button>
                </div>
            </div>

            <button type="submit" id="submitBtn">
                Predict BBB Penetration
            </button>
        </form>

        <div id="result" class="result"></div>
        <div id="error" class="error"></div>
    </div>

    <script>
        const form = document.getElementById('predictionForm');
        const resultDiv = document.getElementById('result');
        const errorDiv = document.getElementById('error');
        const submitBtn = document.getElementById('submitBtn');

        function fillExample(smiles) {
            document.getElementById('smiles').value = smiles;
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const smiles = document.getElementById('smiles').value.trim();
            
            // Clear previous results
            resultDiv.classList.remove('show', 'positive', 'negative');
            errorDiv.classList.remove('show');
            
            // Show loading state
            submitBtn.disabled = true;
            submitBtn.innerHTML = 'Predicting<span class="loading"></span>';

            try {
                const response = await fetch('/predict', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ smiles: smiles })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'Prediction failed');
                }

                // Display results
                displayResult(data);

            } catch (error) {
                errorDiv.textContent = `Error: ${error.message}`;
                errorDiv.classList.add('show');
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = 'Predict BBB Penetration';
            }
        });

        function displayResult(data) {
            const isPenetrating = data.prediction === 'BBB+';
            const scorePercent = (data.bbb_score * 100).toFixed(1);
            const confidencePercent = (data.confidence * 100).toFixed(1);

            resultDiv.className = 'result show ' + (isPenetrating ? 'positive' : 'negative');
            
            let html = `
                <h2>${isPenetrating ? '✅ BBB+ (Penetrates)' : '❌ BBB- (Does Not Penetrate)'}</h2>
                
                <div class="result-item">
                    <strong>SMILES:</strong> ${data.smiles}
                </div>
                
                <div class="result-item">
                    <strong>BBB Score:</strong> ${scorePercent}%
                </div>
                
                <div class="progress-bar">
                    <div class="progress-fill" style="width: ${scorePercent}%">${scorePercent}%</div>
                </div>
                
                <div class="result-item">
                    <strong>Confidence:</strong> ${confidencePercent}%
                </div>
            `;

            if (data.rules_check && Object.keys(data.rules_check).length > 0) {
                html += `
                    <div class="result-item" style="margin-top: 15px;">
                        <strong>⚠️ Rule Violations:</strong><br>
                        <ul style="margin-left: 160px; margin-top: 5px;">
                `;
                for (const [rule, value] of Object.entries(data.rules_check)) {
                    html += `<li>${rule}: ${value}</li>`;
                }
                html += `</ul></div>`;
            }

            resultDiv.innerHTML = html;
        }
    </script>
</body>
</html>
